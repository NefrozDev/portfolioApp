<section class="sign-in-callback">
  <div class="sign-in-callback__card glass-card">
    <h1 class="sign-in-callback__title">{{ 'app.account.callback.title' | translate }}</h1>
    @switch (status()) {
      @case ('pending') {
        <p class="sign-in-callback__text" role="status">
          {{ 'app.account.callback.progress' | translate }}
        </p>
      }
      @default {
        <p class="sign-in-callback__text" role="alert">
          {{ 'app.account.callback.' + status() | translate }}
        </p>
        <a class="sign-in-callback__back" [routerLink]="returnTo()">
          {{ 'app.account.callback.back' | translate }}
        </a>
      }
    }
  </div>
</section>
