name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # SHARED CONTRACTS
      - name: Install shared contracts deps
        working-directory: Common
        run: npm ci --ignore-scripts

      # FRONTEND
      - name: Install frontend deps
        working-directory: portfolio
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: portfolio
        run: npm run build

      # Accessibility (WCAG 2.2 AA) in a real browser, against the build just made.
      - name: Check accessibility
        working-directory: portfolio
        # The pinned local Playwright, never one npx would fetch.
        run: npm run e2e:install -- --with-deps && npm run e2e

      - name: Keep the accessibility results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: portfolio/dist/.playwright/results
          retention-days: 7

      # BACKEND
      - name: Install backend deps
        working-directory: Backend
        run: npm ci --ignore-scripts

      - name: Build backend
        working-directory: Backend
        run: npm run build

      # TESTS (frontend with coverage thresholds, libraries, demos, backend)
      - name: Test all projects
        run: npm run test:coverage
